name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: host build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMOTOR_BUILD_TESTS=ON -DMOTOR_BUILD_SIM=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  arm:
    name: arm-none-eabi core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Configure
        run: cmake -S . -B build-arm -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/arm-none-eabi.cmake -DMOTOR_BUILD_TESTS=OFF -DMOTOR_BUILD_SIM=OFF
      - name: Build
        run: cmake --build build-arm -j
